%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/planet,cosmo-kbd-backlight.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Planet Cosmo Communicator keyboard backlight

maintainers:
  - atzero <atzandrew@gmail.com>

description: |
  The Cosmo uses MT6771 PWM1 in FIFO mode and a 5 V rail (GPIO178)
  shared with HDMI and the right USB-C port, provided as a regulator by
  planet,cosmo-fusb301a. This device owns the entire general PWM register resource;
  it must replace the generic PWM provider, never coexist with it.
  Only channel 1 is programmed. The rail is enabled for keyboard on;
  keyboard off only releases it if HDMI detect GPIO54 is low.

properties:
  compatible:
    const: planet,cosmo-kbd-backlight

  reg:
    maxItems: 1

  clocks:
    minItems: 6
    maxItems: 6

  clock-names:
    items:
      - const: top
      - const: main
      - const: pwm1
      - const: pwm2
      - const: pwm3
      - const: pwm4

  power-supply:
    description: Shared 5 V rail (keyboard, HDMI, right USB-C VBUS).

  hdmi-detect-gpios:
    maxItems: 1
    description: Active high HDMI detection; never drop enable while high.

  pinctrl-names:
    const: default

  pinctrl-0: true

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - power-supply
  - hdmi-detect-gpios
  - pinctrl-names
  - pinctrl-0

additionalProperties: false
