%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/awinic,aw9524-leds.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW9524 current-sink LEDs

maintainers:
  - atzero <atzandrew@gmail.com>

description: |
  AW9524 LED controller on the Cosmo Communicator. Pin indices 0..7
  correspond to P0_0..7 and 8..15 to P1_0..7. All channels start off.
  The chip uses quarter-scale global current as in the stock driver.

properties:
  compatible:
    const: awinic,aw9524-leds
  reg:
    maxItems: 1
  reset-gpios:
    maxItems: 1
    description: Active-low hardware enable/reset line.
  '#address-cells':
    const: 1
  '#size-cells':
    const: 0

patternProperties:
  '^led@[0-9a-f]$':
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false
    properties:
      reg:
        minimum: 0
        maximum: 15
      default-state:
        const: "off"
      max-brightness:
        minimum: 1
        maximum: 255
    required:
      - reg
      - max-brightness

required:
  - compatible
  - reg
  - reset-gpios
  - '#address-cells'
  - '#size-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        led-controller@5b {
            compatible = "awinic,aw9524-leds";
            reg = <0x5b>;
            reset-gpios = <&pio 109 GPIO_ACTIVE_LOW>;
            #address-cells = <1>;
            #size-cells = <0>;
            led@0 {
                reg = <0>;
                label = "cosmo:aw9524:p0-0";
                max-brightness = <64>;
            };
        };
    };
